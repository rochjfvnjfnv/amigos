<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigos — Red Social</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="authScreen" class="screen">
    <div class="card">
      <h1 class="logo">Amigos</h1>
      <p class="tagline">Conoce gente nueva cerca de ti</p>

      <div id="loginForm">
        <input id="liEmail" type="email" placeholder="Correo electrónico" required>
        <input id="liPass" type="password" placeholder="Contraseña" required>
        <button onclick="login()">Iniciar sesión</button>
        <p class="switch">¿No tienes cuenta? <a href="#" onclick="showRegister()">Regístrate</a></p>
      </div>

      <div id="registerForm" style="display:none">
        <input id="rgName" type="text" placeholder="Nombre" required>
        <input id="rgEmail" type="email" placeholder="Correo electrónico" required>
        <input id="rgPass" type="password" placeholder="Contraseña" required>
        <input id="rgAge" type="number" placeholder="Edad" min="13" max="120" required>
        <input id="rgHobby" type="text" placeholder="Pasatiempo / interés">
        <textarea id="rgBio" rows="2" placeholder="Cuéntanos sobre ti (opcional)"></textarea>
        <button onclick="register()">Crear cuenta</button>
        <p class="switch">¿Ya tienes cuenta? <a href="#" onclick="showLogin()">Inicia sesión</a></p>
      </div>

      <p id="authError" class="error"></p>
    </div>
  </div>

  <div id="appScreen" class="screen" style="display:none">
    <header>
      <div class="header-inner">
        <h1 class="logo">Amigos</h1>
        <div class="me">
          <span id="meAvatar" class="avatar"></span>
          <span id="meName"></span>
          <button id="logoutBtn" onclick="logout()">Salir</button>
        </div>
      </div>
      <nav>
        <button class="tab active" data-tab="discover">Descubrir</button>
        <button class="tab" data-tab="friends">Amigos</button>
        <button class="tab" data-tab="chat">Chat</button>
      </nav>
    </header>

    <main>
      <section id="discover" class="view">
        <h2>Personas para conocer</h2>
        <div id="peopleList" class="grid"></div>
      </section>

      <section id="friends" class="view" style="display:none">
        <h2>Tus amigos</h2>
        <div id="friendsList" class="grid"></div>
      </section>

      <section id="chat" class="view" style="display:none">
        <h2>Chat con tus amigos</h2>
        <div id="chatFriends" class="chats"></div>
        <div id="chatWindow" class="chat-window" style="display:none">
          <div id="chatHeader" class="chat-header"></div>
          <div id="chatMessages" class="chat-messages"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
            <button type="submit">Enviar</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
