<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Amigos — Conoce gente nueva</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= AUTH ================= -->
  <div id="authScreen" class="screen">
    <div class="auth-bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>
    <div class="auth-card">
      <div class="auth-brand">
        <img src="logo.svg" alt="Amigos" class="brand-logo">
        <h1 class="wordmark">Amigos</h1>
        <p class="tagline">Conoce gente nueva. Haz amigos reales. 💘</p>
      </div>

      <div id="loginForm" class="form">
        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm0 2v.3l8 6 8-6V7H4zm0 2.8V18h16V9.8l-8 6-8-6z"/></svg>
          <input id="liEmail" type="email" placeholder="Correo electrónico" autocomplete="email">
        </div>
        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1V7a5 5 0 0 1 5-5zm3 8V7a3 3 0 0 0-6 0v3h6z"/></svg>
          <input id="liPass" type="password" placeholder="Contraseña" autocomplete="current-password">
        </div>
        <button class="btn-grad" onclick="login()">Iniciar sesión</button>
        <p class="switch">¿No tienes cuenta? <a href="#" onclick="showRegister();return false;">Créate una</a></p>
      </div>

      <div id="registerForm" class="form" style="display:none">
        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z"/></svg>
          <input id="rgName" type="text" placeholder="Tu nombre" autocomplete="name">
        </div>
        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm0 2v.3l8 6 8-6V7H4zm0 2.8V18h16V9.8l-8 6-8-6z"/></svg>
          <input id="rgEmail" type="email" placeholder="Correo electrónico" autocomplete="email">
        </div>
        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1V7a5 5 0 0 1 5-5zm3 8V7a3 3 0 0 0-6 0v3h6z"/></svg>
          <input id="rgPass" type="password" placeholder="Contraseña (mín. 4 caracteres)" autocomplete="new-password">
        </div>
        <div class="field-row">
          <div class="field half">
            <svg viewBox="0 0 24 24"><path d="M13 2v5a1 1 0 0 0 1 1h5l-6-6zm-1.4 1.4L17.6 9H12a1 1 0 0 1-1-1V3.4a1 1 0 0 1 1.6 0zM5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z"/></svg>
            <input id="rgAge" type="number" placeholder="Edad" min="13" max="120">
          </div>
          <div class="field half">
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 1 10 10c0 4-2.5 7.5-6.5 8.5a2.5 2.5 0 0 1-2-2.3 4 4 0 1 0-5-3.8 3.5 3.5 0 0 0 3 3.3v.5c0 1.2-.8 2.3-2 2.6C4 20.4 2 16.6 2 12A10 10 0 0 1 12 2z"/></svg>
            <input id="rgHobby" type="text" placeholder="Pasatiempo">
          </div>
        </div>
        <textarea id="rgBio" rows="3" placeholder="Cuéntanos sobre ti (opcional)"></textarea>
        <button class="btn-grad" onclick="register()">Crear mi cuenta</button>
        <p class="switch">¿Ya tienes cuenta? <a href="#" onclick="showLogin();return false;">Inicia sesión</a></p>
      </div>

      <p id="authError" class="error"></p>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div id="appScreen" class="screen" style="display:none">
    <header class="app-header">
      <div class="brand">
        <img src="logo.svg" alt="Amigos">
        <span class="wordmark-sm">Amigos</span>
      </div>
      <div class="header-actions">
        <div class="bell-wrap">
          <button id="bellBtn" class="icon-btn" title="Notificaciones">
            <svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm6-6V11a6 6 0 0 0-5-5.9V3.5a1 1 0 0 0-2 0v1.6A6 6 0 0 0 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          </button>
          <span id="bellBadge" class="badge" style="display:none">0</span>
          <div id="notifPanel" class="notif-panel" style="display:none"></div>
        </div>
        <div class="me-badge" id="meBadge" title="Editar mi perfil">
          <span id="meAvatar" class="avatar"></span>
          <span id="meName"></span>
        </div>
        <button id="logoutBtn" class="icon-btn" onclick="logout()" title="Cerrar sesión">
          <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v3H3v4h7v3zm8-13H8v3h8v10H8v3h10a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/></svg>
        </button>
      </div>
    </header>

    <nav class="tabbar">
      <button class="tab active" data-tab="discover">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm3.6 6.4l-2.2 5.2-5.2 2.2 2.2-5.2 5.2-2.2zM13.5 12a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0z"/></svg>
        <span>Descubrir</span>
      </button>
      <button class="tab" data-tab="friends">
        <svg viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm7 2a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-7 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6zm8 1c1.5 0 4 1 4 4v1h4v-2c0-3-3-4.5-6-4.8-1 .8-1.8 1.2-2 1.8z"/></svg>
        <span>Amigos</span>
      </button>
      <button class="tab" data-tab="chat">
        <svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.6 1.4 5 3.7 6.6-.2 1.3-.9 2.4-2 3.4 1.5-.2 2.9-.8 4-1.5 1.3.5 2.8.8 4.3.8 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>
        <span>Chat</span>
      </button>
    </nav>

    <main class="app-main">
      <!-- DESCUBRIR -->
      <section id="discover" class="view">
        <div class="search-bar">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
          <input id="searchInput" type="text" placeholder="Buscar por nombre o interés...">
        </div>
        <div id="deck" class="deck"></div>
        <div class="deck-actions" id="deckActions">
          <button id="skipBtn" class="round-btn skip" title="Saltar">
            <svg viewBox="0 0 24 24"><path d="M12 10.6L6.6 5.2 5.2 6.6 10.6 12l-5.4 5.4 1.4 1.4L12 13.4l5.4 5.4 1.4-1.4L13.4 12l5.4-5.4-1.4-1.4L12 10.6z"/></svg>
          </button>
          <button id="likeBtn" class="round-btn like" title="Me gusta">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.1C1 8 3.5 5 6.8 5c2 0 3.4 1.1 4.2 2.6h2C13.8 6.1 15.2 5 17.2 5c3.3 0 5.8 3 4.3 6.9C19.5 16.4 12 21 12 21z"/></svg>
          </button>
        </div>
        <p id="deckEmpty" class="empty-state" style="display:none"><span class="emoji">🔍</span>No hay más personas por ahora.</p>
      </section>

      <!-- AMIGOS -->
      <section id="friends" class="view" style="display:none">
        <h2 class="section-title">Tus amigos</h2>
        <div id="friendsList" class="grid"></div>
      </section>

      <!-- CHAT -->
      <section id="chat" class="view" style="display:none">
        <h2 class="section-title">Tus conversaciones</h2>
        <div class="chat-layout">
          <div id="chatFriends" class="chats"></div>
          <div id="chatWindow" class="chat-window" style="display:none">
            <div id="chatHeader" class="chat-header"></div>
            <div id="chatMessages" class="chat-messages"></div>
            <form id="chatForm" class="chat-form">
              <input id="chatInput" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
              <button type="submit">
                <svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.6-8.4-17.6-8.4L3 9l12 3-12 3 1.4 5.4z"/></svg>
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ================= MODAL: EDITAR MI PERFIL ================= -->
  <div id="profileModal" class="modal" style="display:none">
    <div class="modal-card">
      <h3>Editar mi perfil</h3>
      <div class="photo-upload" onclick="document.getElementById('profilePhotoInput').click()">
        <img id="profilePhotoPreview" class="photo-preview" alt="Mi foto">
        <div class="photo-overlay">
          <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm-9 8a9 9 0 0 1 18 0v1H3v-1z"/></svg>
          Cambiar foto
        </div>
      </div>
      <input id="profilePhotoInput" type="file" accept="image/*" style="display:none">
      <div class="modal-fields">
        <input id="peName" type="text" placeholder="Nombre">
        <input id="peAge" type="number" placeholder="Edad" min="13" max="120">
        <input id="peHobby" type="text" placeholder="Pasatiempo o interés">
        <textarea id="peBio" rows="3" placeholder="Cuéntanos sobre ti"></textarea>
      </div>
      <p id="profileError" class="error"></p>
      <div class="modal-btns">
        <button class="btn-ghost" onclick="closeProfileModal()">Cancelar</button>
        <button class="btn-grad" onclick="saveProfile()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- ================= MODAL: VER PERFIL DE OTRO ================= -->
  <div id="detailModal" class="modal" style="display:none">
    <div class="modal-card detail-card">
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- ================= MODAL: MATCH ================= -->
  <div id="matchModal" class="modal" style="display:none">
    <div class="modal-card match-card">
      <div class="match-hearts">💘</div>
      <h2>¡Es un match!</h2>
      <p id="matchText">Se gustaron mutuamente</p>
      <div class="match-avatars">
        <img id="matchMyAvatar" alt="">
        <img id="matchOtherAvatar" alt="">
      </div>
      <div class="modal-btns">
        <button class="btn-ghost" onclick="closeMatch()">Seguir explorando</button>
        <button class="btn-grad" onclick="goToChatFromMatch()">Enviar mensaje</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
