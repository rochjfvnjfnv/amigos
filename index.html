<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conoce Amigos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 15px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,.3);
      overflow: hidden;
    }
    header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 24px;
      text-align: center;
    }
    header h1 { font-size: 24px; margin-bottom: 4px; }
    header p { font-size: 14px; opacity: .9; }
    main { padding: 20px; }
    form { display: flex; flex-direction: column; gap: 10px; }
    input {
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #764ba2; }
    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .1s;
    }
    button:hover { transform: scale(1.02); }
    #list { list-style: none; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    #list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #f7f7fb;
      border-radius: 10px;
    }
    #list li .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px;
      flex-shrink: 0;
    }
    #list li .info { flex: 1; }
    #list li .info .name { font-weight: 600; }
    #list li .info .age { color: #888; font-size: 13px; }
    #list li .delete {
      background: #ff5f6d;
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .empty { text-align: center; color: #999; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Conoce Amigos</h1>
      <p>Agrega a tus nuevos amigos</p>
    </header>
    <main>
      <form id="form">
        <input id="name" type="text" placeholder="Nombre" required>
        <input id="age" type="number" placeholder="Edad" min="1" max="120" required>
        <input id="hobby" type="text" placeholder="Interés o pasatiempo" required>
        <button type="submit">Agregar Amigo</button>
      </form>
      <ul id="list"></ul>
      <p id="empty" class="empty">Aún no tienes amigos. Agrega el primero.</p>
    </main>
  </div>

  <script>
    const form = document.getElementById('form');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const name = document.getElementById('name');
    const age = document.getElementById('age');
    const hobby = document.getElementById('hobby');

    const friends = JSON.parse(localStorage.getItem('friends') || '[]');

    function render() {
      list.innerHTML = '';
      empty.style.display = friends.length ? 'none' : 'block';
      friends.forEach((f, i) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="avatar">${f.name.charAt(0).toUpperCase()}</div>
          <div class="info">
            <div class="name">${f.name}</div>
            <div class="age">${f.age} años · ${f.hobby}</div>
          </div>
          <button class="delete" data-i="${i}">Eliminar</button>
        `;
        list.appendChild(li);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      friends.push({ name: name.value.trim(), age: age.value, hobby: hobby.value.trim() });
      localStorage.setItem('friends', JSON.stringify(friends));
      form.reset();
      render();
    });

    list.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete')) {
        friends.splice(Number(e.target.dataset.i), 1);
        localStorage.setItem('friends', JSON.stringify(friends));
        render();
      }
    });

    render();
  </script>
</body>
</html>
